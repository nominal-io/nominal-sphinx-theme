[project]
name = "nominal-sphinx-theme"
version = "0.1.0"
description = "Nominal's look for Sphinx docs: the Shibuya theme, styled like instro's docs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sphinx>=9.1.0",
    "shibuya>=2026.7.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nominal_sphinx_theme"]
